<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
  <title>Loading…</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent;
      color: #fff;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-app-region: drag;
      user-select: none;
    }

    /* ────────── Splash card ────────── */
    .splash {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 38px 36px 56px;
      border-radius: 22px;
      overflow: hidden;
      background:
        /* darkening overlay */
        radial-gradient(ellipse 80% 60% at 50% 0%, rgba(196,25,43,0.10), transparent 70%),
        linear-gradient(180deg, rgba(8,9,14,0.78) 0%, rgba(8,9,14,0.55) 50%, rgba(8,9,14,0.92) 100%),
        /* atmospheric forest image */
        url('../assets/background.jpg') center / cover no-repeat,
        #0a0c12;
      border: 1px solid rgba(255,255,255,0.06);
      border-top-color: rgba(255,255,255,0.10);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.06),
        inset 0 0 80px rgba(0,0,0,0.50),
        0 0 0 1px rgba(196,25,43,0.18),
        0 0 50px rgba(196,25,43,0.18),
        0 30px 70px rgba(0,0,0,0.75);
      animation: card-in 0.45s cubic-bezier(0.2, 0.9, 0.3, 1.1);
    }
    .splash::before {
      /* vignette + extra mood */
      content: '';
      position: absolute; inset: 0;
      background:
        radial-gradient(ellipse 100% 80% at 50% 50%, transparent 40%, rgba(0,0,0,0.55) 100%),
        radial-gradient(ellipse 60% 40% at 50% 100%, rgba(196,25,43,0.12), transparent 70%);
      pointer-events: none;
    }
    .splash::after {
      /* subtle grain */
      content: '';
      position: absolute; inset: -10%;
      background:
        repeating-linear-gradient(115deg,
          rgba(255,255,255,0.012) 0px,
          rgba(255,255,255,0.012) 1px,
          transparent 1px,
          transparent 4px);
      mix-blend-mode: screen;
      animation: drift 14s linear infinite;
      pointer-events: none;
      opacity: 0.6;
    }
    @keyframes card-in {
      from { opacity: 0; transform: scale(0.96); }
      to   { opacity: 1; transform: scale(1); }
    }
    @keyframes drift {
      from { transform: translate(0, 0); }
      to   { transform: translate(-40px, 30px); }
    }

    /* ────────── Logo with crosshair marks ────────── */
    .logo-wrap {
      position: relative;
      width: 260px;
      height: 260px;
      margin-top: 28px;
      display: grid; place-items: center;
      z-index: 2;
    }
    .logo-aura {
      position: absolute; inset: 0;
      border-radius: 50%;
      background: radial-gradient(circle,
        rgba(196,25,43,0.35) 0%,
        rgba(196,25,43,0.12) 38%,
        transparent 68%);
      filter: blur(14px);
      opacity: 0;
      animation:
        aura-in 1.0s cubic-bezier(0.4,0,0.2,1) forwards 0.2s,
        aura-pulse 2.8s ease-in-out 1.3s infinite;
    }
    @keyframes aura-in {
      to { opacity: 1; }
    }
    @keyframes aura-pulse {
      0%, 100% { opacity: 0.75; transform: scale(1); }
      50%      { opacity: 1.0;  transform: scale(1.06); }
    }
    .logo-img {
      position: relative;
      width: 220px; height: 220px;
      object-fit: contain;
      z-index: 1;
      filter:
        drop-shadow(0 6px 18px rgba(196,25,43,0.55))
        drop-shadow(0 0 22px rgba(255,80,90,0.35));
      animation: logo-in 0.9s cubic-bezier(0.2, 0.8, 0.3, 1.0) forwards 0.15s;
      opacity: 0;
      transform: scale(0.92);
    }
    @keyframes logo-in {
      to { opacity: 1; transform: scale(1); }
    }

    /* Crosshair tick marks at logo corners */
    .tick {
      position: absolute;
      width: 22px; height: 22px;
      opacity: 0;
      animation: tick-in 0.5s ease forwards 1.1s;
    }
    .tick::before, .tick::after {
      content: '';
      position: absolute;
      background: var(--red, #e84256);
      box-shadow: 0 0 6px rgba(232,66,86,0.65);
    }
    .tick::before { /* horizontal */ width: 100%; height: 1.5px; top: 50%; transform: translateY(-50%); }
    .tick::after  { /* vertical */   width: 1.5px; height: 100%; left: 50%; transform: translateX(-50%); }
    .tick-tl { top: 4%;    left: 4%; }
    .tick-tr { top: 4%;    right: 4%; }
    .tick-bl { bottom: 4%; left: 4%; }
    .tick-br { bottom: 4%; right: 4%; }
    @keyframes tick-in { to { opacity: 0.75; } }

    /* ────────── Text block ────────── */
    .text-block {
      margin-top: 22px;
      display: flex; flex-direction: column; align-items: center;
      gap: 10px;
      z-index: 2;
    }
    .title {
      font-family: 'Georgia', 'Cormorant Garamond', 'Times New Roman', serif;
      font-size: 26px;
      font-weight: 600;
      letter-spacing: 0.01em;
      color: #f3f3f3;
      text-align: center;
      text-shadow: 0 2px 6px rgba(0,0,0,0.55);
      opacity: 0;
      animation: text-in 0.6s ease forwards 1.3s;
    }
    .divider {
      display: flex; align-items: center; gap: 10px;
      opacity: 0;
      animation: text-in 0.5s ease forwards 1.5s;
    }
    .divider-line { width: 50px; height: 1px; background: rgba(255,255,255,0.18); }
    .divider-diamond {
      width: 8px; height: 8px;
      transform: rotate(45deg);
      border: 1px solid rgba(232,66,86,0.85);
      background: transparent;
      box-shadow: 0 0 8px rgba(232,66,86,0.45);
    }
    .subtitle {
      font-size: 13.5px;
      color: rgba(255,255,255,0.55);
      letter-spacing: 0.01em;
      text-align: center;
      line-height: 1.55;
      max-width: 320px;
      opacity: 0;
      animation: text-in 0.6s ease forwards 1.7s;
    }
    @keyframes text-in {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ────────── Bottom: progress bar + status row ────────── */
    .bottom-block {
      position: absolute;
      left: 36px; right: 36px;
      bottom: 32px;
      display: flex; flex-direction: column; gap: 14px;
      z-index: 2;
    }
    .progress {
      position: relative;
      width: 100%; height: 3px;
      background: rgba(255,255,255,0.06);
      border-radius: 999px;
      overflow: hidden;
    }
    .progress-fill {
      position: absolute;
      top: 0; left: 0;
      height: 100%; width: 0%;
      background: linear-gradient(90deg,
        rgba(196,25,43,0.40),
        rgba(255,80,90,1),
        rgba(196,25,43,0.40));
      box-shadow:
        0 0 8px rgba(255,80,90,0.85),
        0 0 18px rgba(255,80,90,0.45);
      border-radius: 999px;
      animation: bar-fill 2.85s cubic-bezier(0.35,0,0.65,1) forwards 0.25s;
    }
    @keyframes bar-fill {
      0% { width: 0%; }
      100% { width: 100%; }
    }
    .status-row {
      display: flex; align-items: center; justify-content: center; gap: 9px;
      font-size: 12px;
      color: rgba(255,255,255,0.55);
      letter-spacing: 0.02em;
      opacity: 0;
      animation: text-in 0.6s ease forwards 0.6s;
    }
    .spinner {
      width: 13px; height: 13px;
      border-radius: 50%;
      border: 1.5px solid rgba(232,66,86,0.30);
      border-top-color: rgba(232,66,86,0.95);
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="splash">
    <div class="logo-wrap">
      <span class="tick tick-tl"></span>
      <span class="tick tick-tr"></span>
      <span class="tick tick-bl"></span>
      <span class="tick tick-br"></span>
      <div class="logo-aura"></div>
      <img class="logo-img" src="../assets/DP_LOGO.png" alt="" draggable="false">
    </div>

    <div class="text-block">
      <div class="title" id="splash-title">Раді вас знову бачити!</div>
      <div class="divider">
        <span class="divider-line"></span>
        <span class="divider-diamond"></span>
        <span class="divider-line"></span>
      </div>
      <div class="subtitle" id="splash-sub">Зачекайте будь ласка, відбувається<br>завантаження лаунчера…</div>
    </div>

    <div class="bottom-block">
      <div class="progress"><div class="progress-fill"></div></div>
      <div class="status-row">
        <span class="spinner"></span>
        <span id="splash-status">Ініціалізація лаунчера…</span>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var lang = (new URLSearchParams(location.search)).get('lang') || 'en';
      var T = {
        uk: {
          title:  'Раді вас знову бачити!',
          sub:    'Зачекайте будь ласка, відбувається<br>завантаження лаунчера…',
          status: 'Ініціалізація лаунчера…',
        },
        en: {
          title:  'Glad to see you again!',
          sub:    'Please wait, the launcher is<br>loading…',
          status: 'Initialising launcher…',
        },
      };
      var t = T[lang] || T.en;
      document.getElementById('splash-title').textContent  = t.title;
      document.getElementById('splash-sub').innerHTML      = t.sub;
      document.getElementById('splash-status').textContent = t.status;
    })();
  </script>
</body>
</html>
