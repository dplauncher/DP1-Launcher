# ═══════════════════════════════════════════════════════════════════════
#  dxvk.conf — tuning config for Deadly Premonition: The Director's Cut
#  Targets DXVK 2.x (latest) on a Vulkan-capable GPU.
#
#  dxvk.conf — конфіг налаштувань для Deadly Premonition: The Director's Cut
#  Розрахований на DXVK 2.x (свіжа версія) + Vulkan-сумісну GPU.
# ═══════════════════════════════════════════════════════════════════════
#
#  HOW TO USE:
#    1. Drop this file into the game folder (next to DeadlyPremonition.exe /
#       DP.exe).
#    2. Launch the game via the launcher with the "DPfix + DXVK" or
#       "DXVK only" preset.
#    3. Compare loading speed + smoothness before/after.
#
#  ЯК ВИКОРИСТАТИ:
#    1. Скопіюй у теку гри (поряд із DeadlyPremonition.exe / DP.exe).
#    2. Запусти лаунчер із пресетом «DPfix + DXVK» або «Тільки DXVK».
#    3. Порівняй швидкість завантаження + плавність до/після.
#
#  TIP / ПІДКАЗКА:
#    After the first session a DeadlyPremonition.dxvk-cache (state cache)
#    file appears next to the .exe — DO NOT delete it. Each subsequent
#    launch reads it and skips the shader-compile work already done.
#    The second/third session should be noticeably smoother.
#
#    Після першої сесії поряд із .exe з'явиться файл
#    DeadlyPremonition.dxvk-cache (state cache). Його НЕ видаляй — кожен
#    наступний запуск читає його і пропускає компіляцію вже-побачених
#    шейдерів. Друга/третя сесія мають бути помітно плавніші.

# ════════════════════════════════════════════════════════════════════
#  Shader compile — avoid stutter on new scenes
#  Шейдери — уникаємо stutter на нових сценах
# ════════════════════════════════════════════════════════════════════

# EN: Asynchronous shader compilation (DXVK-async / DXVK 2.x with GPL).
#     Instead of locking the current frame, the compiler runs in the
#     background and renders a placeholder.
# UA: Асинхронна компіляція шейдерів (DXVK-async / DXVK 2.x з GPL).
#     Замість локу кадру компілятор працює фоном і малює заглушку.
dxvk.enableAsync = true
dxvk.numAsyncThreads = 0

# EN: Graphics Pipeline Library (mainline DXVK 2.x). Lets DXVK link
#     pipelines from precompiled modules instead of compiling from scratch.
# UA: Graphics Pipeline Library (мейнлайн DXVK 2.x). Дозволяє швидко
#     лінкувати pipeline-и з модулів замість компіляції з нуля.
dxvk.enableGraphicsPipelineLibrary = True

# EN: Number of CPU threads used for pipeline compilation (0 = all cores).
# UA: Кількість CPU-потоків під компіляцію pipeline-ів (0 = всі ядра).
dxvk.numCompilerThreads = 0

# ════════════════════════════════════════════════════════════════════
#  D3D9 perf — DP-specific optimizations
#  D3D9 perf — DP-специфічні оптимізації
# ════════════════════════════════════════════════════════════════════

# EN: Caches dynamic buffers (DP heavily streams geometry and UI through
#     them). Noticeable FPS uplift in open areas / in town.
# UA: Кешує динамічні буфери (DP активно стрімить геометрію та UI через
#     них). Помітний приріст FPS у відкритих локаціях / у місті.
d3d9.cachedDynamicBuffers = True

# EN: Old D3D9 games often handle managed VRAM poorly. This forces DXVK
#     to free resources immediately on unlock — fewer micro-freezes.
# UA: Старі D3D9-ігри часто погано чистять managed VRAM. Це примушує
#     DXVK звільняти ресурси одразу при unlock — менше мікрозависань.
d3d9.evictManagedOnUnlock = True

# EN: Doesn't block game startup on creating large D3D surfaces — DXVK
#     defers them until first actual use.
# UA: Не блокує запуск гри на створенні великих D3D-surface-ів — DXVK
#     відкладе їх до першого реального використання.
d3d9.deferSurfaceCreation = True

# EN: Allows non-blocking buffer locks (D3DLOCK_DONOTWAIT). DP often hits
#     locks during world streaming — this avoids stalls on the main thread.
# UA: Дозволяє неблокуючі lock-и буферів (D3DLOCK_DONOTWAIT). DP при
#     стрімінгу світу часто пробиває lock одразу — це позбавляє стіл-стайлів
#     на main thread.
d3d9.allowDoNotWait = True

# ════════════════════════════════════════════════════════════════════
#  Memory — for the 4GB-patched DP
#  Пам'ять — для 4GB-патченої DP
# ════════════════════════════════════════════════════════════════════

# EN: How much VRAM DXVK reports to the game (MB). DP is 32-bit and with
#     the 4GB patch can address up to 4 GB. DXVK's default sometimes
#     reports too little for old games and they prematurely evict textures.
# UA: Скільки VRAM DXVK звітує грі (МБ). DP — 32-бітна, з 4GB Patch може
#     адресувати до 4 ГБ. Дефолт DXVK іноді звітує надто мало для старих
#     ігор і вони передчасно вивантажують текстури.
d3d9.maxAvailableMemory = 4096

# ════════════════════════════════════════════════════════════════════
#  Framerate
# ════════════════════════════════════════════════════════════════════

# EN: Removes DXVK's internal frame cap. DP ties asset-streaming timing
#     to FPS — without this, loading screens can be several times longer.
#     The 60 FPS gameplay lock from DPfix still applies (it's enforced by
#     the game's own code, not by DXVK).
# UA: Знімає внутрішній DXVK frame-cap. DP прив'язує таймінг ассет-стрімінгу
#     до FPS — без цього завантаження можуть бути в рази довші.
#     Gameplay 60 FPS lock DPfix залишається чинним (його робить ігровий код).
d3d9.maxFrameRate = 0

# ════════════════════════════════════════════════════════════════════
#  Experimental (uncomment if the standard set isn't enough)
#  Експериментальні (розкоментуй, якщо стандартний набір не допоміг)
# ════════════════════════════════════════════════════════════════════

# EN: Lower input lag (by 1 frame), small loss of CPU↔GPU parallelism.
#     At 60 FPS-lock that's a 16ms difference — feels good in combat.
# UA: Менше input lag (на 1 кадр), невелика втрата паралелізму CPU↔GPU.
#     При 60 FPS-локі це 16мс різниці, відчутне у бойових моментах.
# dxvk.maxFramesInFlight = 1

# EN: Disables DXVK's own vsync. CRITICAL for DP load-time fix — without
#     it, swapchain FIFO caps loading frames at 60 FPS (monitor refresh),
#     and DP ties loading time to frames-rendered, so 10-min loads happen.
#     With this off, loading screens render at hundreds of FPS = ~10× faster.
#     Gameplay 60 FPS lock stays in place (DPfix enforces it in game code).
# UA: Вимикає DXVK-овий vsync. КРИТИЧНО для фіксу довгих лоадінгів DP — без
#     цього swapchain FIFO лімітує лоадинг-кадри на 60 FPS (refresh монітора),
#     а DP прив'язує час лоаду до кількості кадрів → 10-хв завантаження.
#     З цим вимкненим чорні екрани лоадингу йдуть на сотнях FPS = ~10× швидше.
#     Gameplay 60 FPS lock залишається (DPfix робить його в ігровому коді).
d3d9.presentInterval = 0

# EN: Latency-sleep (DXVK 2.4+). NVIDIA-Reflex-style CPU/GPU sync to lower
#     latency without losing FPS. Auto = enabled if available.
# UA: Latency-sleep (DXVK 2.4+). Аналог NVIDIA Reflex — синхронізує CPU
#     і GPU для меншого latency без втрати FPS. Auto = увімкнено за наявності.
# dxvk.latencySleep = Auto

# EN: Force SM3. DP already uses SM3, but enforce helps in rare cases when
#     the driver hands back shaders of a lower model.
# UA: Force SM3. DP вже використовує SM3, але enforce рятує у рідкісних
#     випадках, коли драйвер видає шейдери нижчої моделі.
# d3d9.shaderModel = 3

# EN: Strict float32 emulation. Some DP shaders may have precision issues
#     on modern GPUs — Strict makes math 1:1 with original D3D9.
# UA: Strict float32 emulation. Деякі шейдери DP можуть мати precision-issues
#     на сучасних GPU — strict робить розрахунки 1:1 з оригінальним D3D9.
# d3d9.floatEmulation = Strict

# EN: Fixes z-fighting in older D3D9 games (fences, distant geometry).
#     DP has such artefacts on far distances in some areas.
# UA: Виправляє z-fighting у старих D3D9-іграх (паркани, далека геометрія).
#     DP має місцями такі артефакти на дальніх дистанціях.
# d3d9.invariantPosition = True

# EN: DXVK HUD — currently ON for diagnosing long load times.
#     compiler   = active threads + pipelines built / queued (watch this!)
#     pipelines  = total pipeline cache size
#     memory     = VRAM in use vs budget
#     fps        = current frame rate
#     frametimes = frame-time graph (spikes = stutter)
# UA: DXVK HUD — зараз УВІМКНЕНО для діагностики довгих лоадінгів.
#     compiler   = активні потоки + скомпільовано / у черзі (стеж за цим!)
#     pipelines  = загальний розмір pipeline-кешу
#     memory     = використання VRAM
#     fps        = поточний фреймрейт
#     frametimes = графік frametime (спайки = stutter)
dxvk.hud = compiler,pipelines,memory,fps,frametimes

# ════════════════════════════════════════════════════════════════════
